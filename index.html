<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Mates - Events</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #ef4444;
            --accent-light: #f87171;
            --success: #10b981;
            --surface-ground: #000000;
            --surface-card: #1a1a1a;
            --surface-hover: #2a2a2a;
            --surface-dim: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #d1d5db;
            --text-tertiary: #9ca3af;
            --text-muted: #6b7280;
            --border: #374151;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--surface-ground);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }

        .header-text h1 {
            font-family: 'Syne', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .header-text p {
            font-size: 14px;
            color: var(--text-tertiary);
        }

        .header-link {
            background: var(--accent);
            color: var(--surface-ground);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .header-link:hover {
            background: var(--accent-light);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .events-section {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
        }

        .events-section h2 {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--accent);
        }

        .event-card {
            background: var(--surface-hover);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.2s;
        }

        .event-card:hover {
            background: var(--surface-dim);
            transform: translateX(4px);
        }

        .event-card:last-child {
            margin-bottom: 0;
        }

        .event-date {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .event-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .event-details {
            display: flex;
            gap: 1rem;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .event-details span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .login-section {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-header h3 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface-hover);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface-dim);
        }

        .login-button {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: var(--surface-ground);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .login-button:hover {
            background: var(--accent-light);
        }

        .login-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent);
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 1rem;
            border: 1px solid var(--accent);
            display: none;
        }

        .login-message.show {
            display: block;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 1rem;
            border: 1px solid var(--success);
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .forgot-link {
            text-align: center;
            margin-top: 1rem;
            font-size: 12px;
        }

        .forgot-link a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .login-section {
                position: static;
            }

            header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .header-link {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <svg class="logo" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="3.5"/>
                    <line x1="28" y1="28" x2="40" y2="40" stroke="white" stroke-width="5" stroke-linecap="round"/>
                    <line x1="40" y1="28" x2="28" y2="40" stroke="white" stroke-width="5" stroke-linecap="round"/>
                    <g transform="translate(64, 32)">
                        <path d="M 0,-2 C -4,-6 -10,-6 -10,0 C -10,6 0,14 0,14 C 0,14 10,6 10,0 C 10,-6 4,-6 0,-2 Z" fill="#ef4444"/>
                    </g>
                    <path d="M 32 68 Q 50 78 68 68" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
                </svg>
                <div class="header-text">
                    <h1>House Mates</h1>
                    <p>Bringing underground sound, above ground.</p>
                </div>
            </div>
            <a href="/dashboard/index.html" class="header-link">Full Dashboard →</a>
        </header>

        <div class="main-grid">
            <!-- Upcoming Events -->
            <div class="events-section">
                <h2>Upcoming Events</h2>
                <div id="events-container"></div>
            </div>

            <!-- Quick Login -->
            <div class="login-section">
                <div class="login-header">
                    <h3>Access Dashboard</h3>
                    <p>Enter your password</p>
                </div>

                <div id="error-message" class="login-message"></div>
                <div id="success-message" class="success-message"></div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email-input" class="form-input" value="hello@housemates.se" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password-input" class="form-input" placeholder="Enter password">
                </div>

                <button class="login-button" onclick="handleQuickLogin()">Sign In</button>

                <div class="forgot-link">
                    <a onclick="handleForgotPassword()">Forgot password?</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = 'housemates2024';

        const events = [
            { date: '22 Aug', name: 'House Mates Invites', venue: 'NK Rooftop', city: 'Stockholm', time: 'TBC' },
            { date: '4 Sep', name: 'Gazebo', venue: 'Trollbacka', city: 'Stockholm', time: '15-03' },
            { date: '5 Sep', name: 'Trollbacka', venue: 'Monsterfest', city: 'Stockholm', time: '15-03' },
            { date: '19 Sep', name: 'Alien party', venue: 'TBC', city: 'Stockholm', time: '21-03' },
            { date: '25 Sep', name: 'House Mates Invites', venue: 'Timebar', city: 'Stockholm', time: '14-19' },
            { date: '26 Sep', name: 'Nattöga', venue: 'Gazebo', city: 'Stockholm', time: 'TBC' }
        ];

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';

            events.forEach(event => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="event-date">${event.date}</div>
                    <div class="event-name">${event.name}</div>
                    <div class="event-details">
                        <span>📍 ${event.venue}</span>
                        <span>🕐 ${event.time}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleQuickLogin() {
            const passwordInput = document.getElementById('password-input');
            const errorMessage = document.getElementById('error-message');
            const password = passwordInput.value;

            errorMessage.classList.remove('show');

            if (!password) {
                errorMessage.textContent = 'Please enter a password.';
                errorMessage.classList.add('show');
                return;
            }

            if (password === CORRECT_PASSWORD) {
                sessionStorage.setItem('hm-session', 'authenticated');
                window.location.href = '/dashboard/index.html';
            } else {
                errorMessage.textContent = 'Incorrect password.';
                errorMessage.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        function handleForgotPassword() {
            const successMessage = document.getElementById('success-message');
            successMessage.textContent = 'Password reset link sent to hello@housemates.se';
            successMessage.classList.add('show');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderEvents();

            const passwordInput = document.getElementById('password-input');
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleQuickLogin();
                }
            });
        });
    </script>
</body>
</html>
